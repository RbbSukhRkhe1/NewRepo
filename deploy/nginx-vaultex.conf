# Vaultex — installed to /etc/nginx/conf.d/default.conf by deploy-native.sh
# SPA: /opt/vaultex/frontend/dist  ·  API: 127.0.0.1:3847 (routes under /api)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vaultex.club www.vaultex.club _;

    root /opt/vaultex/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend mounts routes at /api — do NOT use proxy_pass with trailing slash (strips prefix)
    location /api {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
