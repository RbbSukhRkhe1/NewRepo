# Vaultex — deploy to Oracle Cloud Ubuntu over SSH after CI passes on main.
# Default: native stack (nginx + Node + Anvil). Optional Docker: set secret DEPLOY_DOCKER=true
#
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# Optional: DEPLOY_PATH (/opt/vaultex), DEPLOY_SSH_PORT (22)

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu (native)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT != '' && secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            trap 'echo "::error::Deploy failed at line $LINENO (exit $?)"' ERR

            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.foundry/bin:${PATH:-}"
            APP_DIR="${DEPLOY_PATH:-/opt/vaultex}"
            REPO_URL="https://github.com/RbbSukhRkhe1/NewRepo.git"

            echo "==> SSH deploy as $(whoami) on $(hostname)"

            if ! command -v git >/dev/null 2>&1; then
              echo "==> Installing git…"
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates
            fi

            if [[ ! -d "$APP_DIR/.git" ]]; then
              echo "==> Cloning $REPO_URL → $APP_DIR"
              sudo mkdir -p "$(dirname "$APP_DIR")"
              sudo rm -rf "$APP_DIR"
              sudo git clone --branch main --depth 1 "$REPO_URL" "$APP_DIR"
              sudo chown -R "$USER:$USER" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/*.sh 2>/dev/null || true

            if [[ "${{ secrets.DEPLOY_DOCKER }}" == "true" ]]; then
              echo "==> Docker deploy"
              bash ./scripts/deploy.sh
            else
              echo "==> Native deploy"
              bash ./scripts/deploy-remote.sh
            fi

      - name: Summary
        if: success()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "Host: **\`${{ secrets.DEPLOY_HOST }}\`** · path: \`${{ secrets.DEPLOY_PATH || '/opt/vaultex' }}\`"
            echo ""
            if [[ "${{ secrets.DEPLOY_DOCKER }}" == "true" ]]; then
              echo "Mode: **Docker Compose**"
            else
              echo "Mode: **native** — http://vaultex.club (port 80)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
