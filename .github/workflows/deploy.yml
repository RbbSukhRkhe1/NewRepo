# Vaultex — deploy to Oracle Cloud Ubuntu over SSH after CI passes on main.
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# Optional: DEPLOY_PATH (/opt/vaultex), DEPLOY_SSH_PORT (22)

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: "SSH diagnostics only (no build/deploy)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu (native)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            val=""
            case "$name" in
              DEPLOY_HOST) val="${{ secrets.DEPLOY_HOST }}" ;;
              DEPLOY_USER) val="${{ secrets.DEPLOY_USER }}" ;;
              DEPLOY_SSH_KEY) val="${{ secrets.DEPLOY_SSH_KEY }}" ;;
            esac
            if [[ -z "$val" ]]; then
              echo "::error::Repository secret $name is missing or empty"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          exit $missing

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DIAGNOSE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_only && 'true' || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT != '' && secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_PATH,DIAGNOSE_ONLY
          script_stop: true
          command_timeout: 45m
          script_stderr: true
          script: |
            set -eo pipefail
            on_err() {
              echo "DEPLOY FAILED at line $1 (exit $2)"
              exit "$2"
            }
            trap 'on_err $LINENO $?' ERR

            export DEPLOY_PATH="${DEPLOY_PATH:-/opt/vaultex}"
            APP_DIR="$DEPLOY_PATH"
            REPO_URL="https://github.com/RbbSukhRkhe1/NewRepo.git"

            echo "========== Vaultex deploy =========="
            echo "user=$(whoami) host=$(hostname) app_dir=$APP_DIR"
            echo "node=$(command -v node || echo MISSING) npm=$(command -v npm || echo MISSING)"
            echo "git=$(command -v git || echo MISSING)"
            echo "api.env=$([ -f /etc/vaultex/api.env ] && echo yes || echo no)"
            echo "anvil.unit=$([ -f /etc/systemd/system/vaultex-anvil.service ] && echo yes || echo no)"
            echo "free -h:"; free -h || true
            echo "df /:"; df -h / || true

            if [[ "${DIAGNOSE_ONLY:-false}" == "true" ]]; then
              echo "Diagnose-only mode — skipping deploy"
              sudo systemctl status vaultex-anvil vaultex-api nginx --no-pager 2>/dev/null || true
              exit 0
            fi

            if ! command -v git >/dev/null 2>&1; then
              echo "==> Installing git…"
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates
            fi

            if [[ ! -d "$APP_DIR/.git" ]]; then
              echo "==> Cloning $REPO_URL → $APP_DIR"
              sudo mkdir -p "$(dirname "$APP_DIR")"
              sudo rm -rf "$APP_DIR"
              sudo git clone --branch main --depth 1 "$REPO_URL" "$APP_DIR"
              sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/*.sh 2>/dev/null || true

            if [[ "${{ secrets.DEPLOY_DOCKER }}" == "true" ]]; then
              echo "==> Docker deploy"
              bash ./scripts/deploy.sh
            else
              echo "==> Native deploy"
              export DEPLOY_PATH="$APP_DIR"
              bash ./scripts/deploy-remote.sh
            fi

      - name: Summary
        if: success()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "Host configured · path: \`${{ secrets.DEPLOY_PATH || '/opt/vaultex' }}\`"
            echo ""
            echo "Site: http://vaultex.club"
          } >> "$GITHUB_STEP_SUMMARY"
