# Deploy Vaultex to Oracle Cloud (Docker Compose stack) after CI passes on main.
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# Optional secrets: DEPLOY_PATH (default /opt/vaultex), DEPLOY_SSH_PORT (default 22)

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: "SSH diagnostics only (no deploy)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vaultex-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu (docker)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Check deploy secrets
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${{ secrets.DEPLOY_HOST }}" ]]; then
            echo "::error::Repository secret DEPLOY_HOST is missing or empty"
            missing=1
          fi
          if [[ -z "${{ secrets.DEPLOY_USER }}" ]]; then
            echo "::error::Repository secret DEPLOY_USER is missing or empty"
            missing=1
          fi
          if [[ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]]; then
            echo "::error::Repository secret DEPLOY_SSH_KEY is missing or empty"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "Required deploy secrets are set."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DIAGNOSE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_only == true && 'true' || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT != '' && secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_PATH,DIAGNOSE_ONLY
          debug: true
          script_stop: true
          command_timeout: 45m
          script: |
            set -eo pipefail
            on_err() {
              echo "DEPLOY FAILED at line $1 (exit $2)"
              exit "$2"
            }
            trap 'on_err $LINENO $?' ERR

            export DEPLOY_PATH="${DEPLOY_PATH:-/opt/vaultex}"
            APP_DIR="$DEPLOY_PATH"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "==> Vaultex deploy | $(whoami)@$(hostname) | $APP_DIR"
            echo "Node: $(command -v node >/dev/null && node --version || echo MISSING)"
            echo "NPM: $(command -v npm >/dev/null && npm --version || echo MISSING)"
            free -h || true
            df -h / || true

            if [[ "${DIAGNOSE_ONLY:-false}" == "true" ]]; then
              echo "==> Diagnose only"
              sudo systemctl status nginx vaultex-api vaultex-anvil --no-pager 2>/dev/null || true
              curl -sI http://127.0.0.1/ | head -5 || true
              curl -s http://127.0.0.1/api/config || true
              exit 0
            fi

            if ! command -v git >/dev/null 2>&1; then
              echo "==> Installing git…"
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates
            fi

            if [[ ! -d "$APP_DIR/.git" ]]; then
              echo "==> Cloning $REPO_URL"
              sudo mkdir -p "$(dirname "$APP_DIR")"
              sudo rm -rf "$APP_DIR"
              sudo git clone --branch main --depth 1 "$REPO_URL" "$APP_DIR"
              sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/*.sh 2>/dev/null || true

            export DEPLOY_PATH="$APP_DIR"
            bash ./scripts/deploy-remote.sh

      - name: Summary
        if: success()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "**Host:** configured · **path:** \`${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/opt/vaultex' }}\`"
            echo ""
            echo "- Stack: **Docker Compose** (\`docker-compose.yml\`)"
            echo "- Web: \`WEB_HOST_PORT\` (default **8080**) → nginx container"
            echo "- API: \`API_HOST_PORT\` (default **3847**) → backend container"
            echo "- Anvil: pinned Foundry image + deterministic mnemonic/chain-id"
            echo ""
            echo "Tip: set **DEPLOY_HOST** to the new instance IP in repo secrets."
          } >> "$GITHUB_STEP_SUMMARY"
