# Vaultex — continuous integration
# Validates install, lint, tests, TypeScript, frontend build, and full Docker Compose stack (prod parity).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Quality — install & lint"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Lint (frontend ESLint)
        run: npm run lint

      - name: Summary — lint
        if: success()
        run: |
          {
            echo "## Quality — lint"
            echo ""
            echo "Node **${{ matrix.node-version }}** · **npm ci** · **ESLint** passed."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: "Quality — workspace tests"
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: true
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Run workspace tests
        run: npm run test

      - name: Summary — tests
        if: success()
        run: |
          {
            echo "## Quality — tests"
            echo ""
            echo "Backend and frontend unit tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: "Build — frontend bundle & backend typecheck"
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: true
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Build frontend (Vite production)
        run: npm run build

      - name: Typecheck backend (tsc, noEmit)
        run: npx tsc -p backend/tsconfig.json

      - name: Summary — build
        if: success()
        run: |
          {
            echo "## Build"
            echo ""
            echo "| Artifact | Command |"
            echo "|----------|---------|"
            echo "| Frontend | \`npm run build\` → \`frontend/dist\` |"
            echo "| Backend | \`npx tsc -p backend/tsconfig.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-scripts:
    name: "Deploy — scripts, nginx & compose"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bash deploy scripts
        run: |
          set -euo pipefail
          for f in scripts/deploy-native.sh scripts/deploy-remote.sh scripts/deploy-env.sh scripts/install-systemd-units.sh scripts/server-bootstrap-native.sh scripts/install-foundry.sh scripts/deploy.sh scripts/wait-for-apt.sh; do
            bash -n "$f"
            echo "OK $f"
          done

      - name: Validate nginx & Docker prod config
        run: |
          set -euo pipefail
          grep -q 'frontend/dist' deploy/nginx-vaultex.conf
          grep -q 'location /api' deploy/nginx-vaultex.conf
          grep -q 'proxy_set_header Upgrade' deploy/nginx-vaultex.conf
          grep -q 'proxy_set_header Upgrade' frontend/nginx.docker.conf
          grep -q 'proxy_pass http://127.0.0.1:3847;' deploy/nginx-vaultex.conf
          ! grep -q 'proxy_pass http://127.0.0.1:3847/;' deploy/nginx-vaultex.conf || \
            (echo "nginx must not strip /api prefix" && exit 1)
          grep -q 'redis:' docker-compose.yml
          grep -q 'REDIS_URL' docker-compose.yml
          grep -q 'ws: true' frontend/vite.config.ts || grep -q 'ws:' frontend/vite.config.ts
          test -f scripts/docker-ci-smoke.mjs
          test -f scripts/simulate-live-donations.mjs
          echo "OK deploy configs"

  docker:
    name: "Docker — compose build & prod smoke"
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "SESSION_SECRET=ci-docker-smoke-$(openssl rand -hex 16)" >> .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --remove-orphans

      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          echo "Waiting for services…"
          for i in $(seq 1 60); do
            if docker compose ps --format json 2>/dev/null | grep -q '"Health":"healthy"' && \
               docker compose exec -T backend node -e "fetch('http://127.0.0.1:3847/ready').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "Backend ready after ${i} attempts"
              exit 0
            fi
            docker compose ps || true
            sleep 5
          done
          echo "::group::Logs"
          docker compose logs --no-color
          echo "::endgroup::"
          exit 1

      - name: Install Node modules (WebSocket client on runner)
        run: npm ci --ignore-scripts

      - name: Smoke test (nginx + API + WebSocket)
        env:
          BASE_URL: http://127.0.0.1:8080
          API_DIRECT_URL: http://127.0.0.1:3847
        run: node scripts/docker-ci-smoke.mjs

      - name: Summary — Docker
        if: success()
        run: |
          {
            echo "## Docker (production parity)"
            echo ""
            echo "- Built **frontend**, **backend**, **redis**, **anvil** via \`docker compose build\`"
            echo "- Stack health: **GET /ready**, SPA, **/api/config**, **WebSocket /api/ws**"
            echo "- Live ledger uses **Redis pub/sub** + in-process events (see \`backend/server/lib/redis.ts\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
