<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style id="vaultex-shell">
      /*
        Critical first paint — runs before bundled JS/CSS loads.
        Prevents a white viewport flash during refresh / cold load.
       */
      html {
        margin: 0;
        height: 100%;
        background-color: #070a12;
      }
      body {
        margin: 0;
        min-height: 100%;
        background-color: #070a12;
      }
      #root {
        min-height: 100%;
        background-color: #070a12;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>VAULTEX · Transparent giving</title>
  </head>
  <body style="margin: 0; background-color: #070a12">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
